name: update-data
on:
  schedule:
    - cron: "23 21 * * *"  # 매일 06:23 KST (정각은 GitHub 혼잡으로 지연·누락이 잦아 피함)
    - cron: "37 9 * * *"   # 매일 18:37 KST (17시 발표 단기예보 반영)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build data
        env:
          KCISA_KEY: ${{ secrets.KCISA_KEY }}
        run: python3 scripts/build_data.py
      - name: Fetch showtimes from official pages
        run: python3 scripts/fetch_details.py
      - name: Link English titles from the English board
        run: python3 scripts/fetch_titles_en.py
      - name: Fetch KMA short-term forecast
        env:
          KMA_KEY: ${{ secrets.KMA_KEY }}
        run: python3 scripts/fetch_weather.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/shows.json data/quality.json data/details.json data/titles_en.json data/weather.json
          git diff --cached --quiet || (git commit -m "data: daily update $(date -u +%Y-%m-%d)" && git push)
